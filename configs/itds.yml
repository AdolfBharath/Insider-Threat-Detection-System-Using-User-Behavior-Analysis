project:
  name: Insider Threat Detection System (ITDS)
  org_size: small-to-medium

paths:
  sqlite_db: data/out/itds.sqlite
  normalized_jsonl: data/out/normalized.jsonl
  clear_normalized_on_run: true

ingestion:
  mode: batch   # batch | tail
  sources:
    - name: linux_auth
      type: file
      format: linux_auth
      path: data/sample_logs/linux/auth.log
    - name: app_access
      type: file
      format: app_access
      path: data/sample_logs/app/app_access.log

# Unsupervised Deep Learning (single model): LSTM Autoencoder
lstm_ae:
  # Sliding window
  seq_len: 5
  stride: 1

  # Performance / memory bounds
  # Caps how many normalized events are kept per user when scoring from JSONL.
  max_events_per_user: 5000

  # Model
  latent_dim: 32
  dropout: 0.2

  # Training (normal behavior only)
  # Uses earliest sequences chronologically as "normal" training.
  train_ratio: 0.7
  epochs: 25
  batch_size: 64
  patience: 5

  # Thresholds learned from training reconstruction errors
  t_medium_percentile: 95
  t_high_percentile: 99

  # Improvement #2: adaptive thresholds (EWMA of "likely normal" errors)
  adaptive_thresholds:
    enabled: true
    alpha: 0.05
    min_count: 20
    k_medium: 2.5
    k_high: 3.5
    min_std: 1.0e-6

  # Improvement #4: optional periodic retraining on recent data
  retrain:
    enabled: false
    every_runs: 10
    min_sequences: 50
    epochs: 3
    batch_size: 64

  # Explainability
  explain_top_k: 3

baseline:
  window_days: 7
  min_events: 30

rules:
  working_hours:
    start: "09:00"
    end: "18:00"
  large_data_threshold_mb: 200
  deny_burst_threshold: 10
  new_resource_weight: 15
  new_ip_weight: 20
  after_hours_weight: 10
  privilege_escalation_weight: 30
  deny_burst_weight: 25
  large_download_weight: 35

anomaly:
  # simple, explainable statistics
  zscore_threshold: 3.0
  ewma_alpha: 0.3

risk:
  decay_half_life_hours: 24
  frequency_window_hours: 6
  threshold_high: 70
  threshold_medium: 45

  # Improvement #3: category weights added to risk
  category_weights:
    after_hours: 5
    sudo: 12
    privileged: 8
    large_download: 15
    many_failures: 6

roles:
  # Improvement #1: role-based behavioral modeling
  default: employee
  list: [employee, manager, admin]
  users:
    alice: employee
    bob: employee
    charlie: manager
    diana: admin

alerting:
  sink: console   # console | json
  json_out: data/out/alerts.jsonl
  clear_on_run: true
